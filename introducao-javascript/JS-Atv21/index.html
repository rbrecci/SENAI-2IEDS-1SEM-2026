<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login com Do While</title>
    <script type="module" src="script.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <main class="container vh-100 align-content-center justify-content-center">
        <div class="container w-50 border rounded p-3">
            <h1 class="text-center">Faça Login</h1>
            <p class="form-label text-center" id="mensagem">Bem vindo!</p>
            <div class="form-control border-0">
                <label for="usuario" class="form-label">Usuário</label>
                <input type="text" id="usuario" class="form-control">
            </div>
            <div class="form-control border-0">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" id="senha" class="form-control">
            </div>
            <button id="Login" class="form-control btn btn-primary">Entrar</button>
        </div>
    </main>
</body>
</html>
