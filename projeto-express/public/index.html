<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Produtos</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">

        <h1>CRUD de Produtos</h1>

        <form id="formProduto">

            <input type="hidden" id="produtoId">

            <input
                type="text"
                id="nome"
                placeholder="Nome do produto"
                required
            >

            <input
                type="number"
                id="preco"
                placeholder="Preço"
                step="0.01"
                required
            >

            <button type="submit">
                Salvar Produto
            </button>

        </form>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tabelaProdutos">
            </tbody>

        </table>

    </div>
    <script src="/js/script.js"></script>
</body>
</html>
