<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main class="container">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </main>
    <button onclick="gerarOi()">Gerar Oi</button>
    <script>
        function gerarOi(){
            const listaDiv = document.querySelectorAll("div");

            listaDiv.forEach(div => {
                div.innerHTML = "<h1>Oi</h1>"
            })
        }
    </script>
    <style>
        .container{
            display: flex;
            gap: 10px;
            width: 100%;
        }
        div{
            background-color: greenyellow;
            height: 75px;
            width: 75px;
        }
    </style>
</body>
</html>
